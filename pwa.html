<body class="h-full bg-slate-50 text-slate-800 flex flex-col justify-between overflow-x-hidden antialiased select-none">

    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 pt-safe px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-indigo-600 text-white flex items-center justify-center shadow-md shadow-brand-500/20">
                    <i data-lucide="wallet" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-tight leading-none">スマート家計簿</h1>
                    <span id="appHeaderSubtitle" class="text-[10px] text-slate-400 font-medium">ホーム</span>
                </div>
            </div>

            <!-- Global Month Selector -->
            <div class="flex items-center">
                <input type="month" id="globalMonthPicker" class="bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 px-2.5 py-1.5 rounded-lg border-0 focus:ring-2 focus:ring-brand-500 cursor-pointer transition">

    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-4 pb-28 space-y-5">

        <!-- Toast Notification Container -->
        <div id="toastContainer" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-full max-w-xs px-4 pointer-events-none flex flex-col space-y-2"></div>

        <!-- TAB 1: HOME (Dashboard View) -->
        <div id="tab-home" class="tab-view space-y-4">
            
            <!-- Summary Balance Card -->
            <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-brand-950 text-white rounded-3xl p-5 shadow-xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
                <div class="relative z-10">
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">今月の収支残高</span>
                    <h2 id="homeBalance" class="text-3xl font-extrabold tracking-tight mt-1 text-white">¥0</h2>
                    
                    <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-700/60">
                        <div class="flex items-center space-x-2.5">
                            <div class="p-2 bg-emerald-500/20 text-emerald-400 rounded-xl">
                                <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-slate-400 font-medium">収入</p>
                                <p id="homeIncome" class="text-sm font-bold text-emerald-400">¥0</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2.5">
                            <div class="p-2 bg-rose-500/20 text-rose-400 rounded-xl">

                            </div>
                            <div>
                                <p class="text-[10px] text-slate-400 font-medium">支出</p>
                                <p id="homeExpense" class="text-sm font-bold text-rose-400">¥0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State Prompt (First Visit) -->
            <div id="homeEmptyPrompt" class="bg-brand-50/80 border border-brand-100 rounded-2xl p-4 flex items-start space-x-3 text-brand-900">
                <div class="p-2 bg-brand-500 text-white rounded-xl shrink-0 mt-0.5">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div class="text-xs">
                    <p class="font-bold text-brand-950 mb-0.5">家計簿をはじめましょう！</p>
                    <p class="text-brand-800 leading-relaxed">右下の「＋」ボタンから最初の収入・支出を記録するか、「予算」タブから目標を設定しましょう。</p>
                </div>
            </div>

            <!-- Category Expense Donut Chart -->
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <h3 class="text-xs font-bold text-slate-700 mb-3 flex items-center">
                    <i data-lucide="pie-chart" class="w-4 h-4 mr-1.5 text-brand-500"></i>支出のカテゴリ内訳

                    <div id="noChartText" class="absolute text-xs text-slate-400">記録された支出がありません</div>

            </div>

            <!-- Recent Activity List -->

            </div>
        </div>

        <!-- TAB 2: TRANSACTIONS (History View) -->
        <div id="tab-transactions" class="tab-view hidden space-y-3">
            <!-- Filter & Search Section -->
            <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm space-y-2">

                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>

                    <i data-lucide="inbox" class="w-6 h-6"></i>
                </div>
                <p class="text-xs font-semibold text-slate-600">該当する取引がありません</p>

        </div>

        <!-- TAB 3: BUDGETS (Budget Management View) -->
        <div id="tab-budgets" class="tab-view hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                    <h3 class="text-xs font-bold text-slate-800">カテゴリ別予算目標</h3>
                    <p class="text-[10px] text-slate-400">今月のやりくりを管理します</p>

                <button id="openBudgetModalBtn" class="px-3 py-1.5 bg-brand-50 text-brand-600 font-bold text-xs rounded-xl hover:bg-brand-100 transition flex items-center">
                    <i data-lucide="settings" class="w-3.5 h-3.5 mr-1"></i>設定

            </div>

            <div id="budgetProgressList" class="space-y-3">
                <!-- Rendered Dynamically -->
            </div>
        </div>

        <!-- TAB 4: SETTINGS & DATA -->
        <div id="tab-settings" class="tab-view hidden space-y-4">
            <!-- App Details -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100">
                    <h3 class="text-xs font-bold text-slate-800 flex items-center">
                        <i data-lucide="smartphone" class="w-4 h-4 mr-2 text-brand-500"></i>アプリ設定・PWA
                    </h3>
                </div>
                <div class="p-4 space-y-3 text-xs">
                    <div class="flex justify-between items-center py-1">
                        <span class="text-slate-600">ホーム画面追加</span>
                        <span class="text-slate-400 text-[11px]">ブラウザメニューから追加可</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="text-slate-600">データ保存先</span>
                        <span class="font-medium text-slate-800">ローカルストレージ (端末内)</span>
                    </div>
                </div>
            </div>

            <!-- Data Operations -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100">
                    <h3 class="text-xs font-bold text-slate-800 flex items-center">

                <div class="p-4 space-y-2.5">

                        <span class="flex items-center"><i data-lucide="download" class="w-4 h-4 mr-2 text-slate-500"></i>CSV形式で出力</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    </button>

                    <label for="importCsvInput" class="w-full py-2.5 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl transition flex items-center justify-between cursor-pointer">
                        <span class="flex items-center"><i data-lucide="upload" class="w-4 h-4 mr-2 text-slate-500"></i>CSVを取り込み</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    </label>
                    <input type="file" id="importCsvInput" accept=".csv" class="hidden">

                    <button id="clearAllDataBtn" class="w-full py-2.5 px-3 bg-rose-50 hover:bg-rose-100 border border-rose-100 text-rose-600 font-bold text-xs rounded-xl transition flex items-center justify-between mt-4">
                        <span class="flex items-center"><i data-lucide="trash-2" class="w-4 h-4 mr-2 text-rose-500"></i>全データを消去</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-rose-400"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <div class="fixed right-5 bottom-20 z-40 pb-safe">
        <button id="fabAddBtn" class="w-14 h-14 bg-gradient-to-tr from-brand-600 to-indigo-600 text-white rounded-full shadow-lg shadow-brand-500/40 flex items-center justify-center active:scale-95 transition-transform">
            <i data-lucide="plus" class="w-7 h-7"></i>
        </button>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200/80 bottom-nav-safe">
        <div class="max-w-md mx-auto grid grid-cols-4 h-16">
            <button onclick="switchTab('home')" id="nav-home" class="nav-btn active flex flex-col items-center justify-center space-y-1 text-brand-600">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">ホーム</span>
            </button>
            <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600">
                <i data-lucide="list-ordered" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">明細</span>
            </button>
            <button onclick="switchTab('budgets')" id="nav-budgets" class="nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600">
                <i data-lucide="target" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">予算</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600">
                <i data-lucide="sliders" class="w-5 h-5"></i>

    <!-- Modal: Add / Edit Transaction -->
    <div id="txModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-200 id-modal-box">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="txModalTitle" class="text-sm font-bold text-slate-800">収支の登録</h3>
                <button id="closeTxModalBtn" class="text-slate-400 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="txForm" class="space-y-3">
                <input type="hidden" id="txEditId" value="">

                <!-- Segmented Control for Income/Expense -->
                <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl text-xs font-bold">
                    <button type="button" id="btnExpenseType" class="py-2 rounded-lg bg-white text-rose-600 shadow-sm transition">支出</button>
                    <button type="button" id="btnIncomeType" class="py-2 rounded-lg text-slate-500 transition">収入</button>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">日付</label>
                    <input type="date" id="inputTxDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">カテゴリ</label>
                    <select id="inputTxCategory" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium">
                        <!-- Populated dynamically -->
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">金額 (円)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-slate-400 text-sm">¥</span>
                        <input type="number" id="inputTxAmount" min="1" step="1" placeholder="0" required class="w-full pl-7 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">メモ (任意)</label>
                    <input type="text" id="inputTxNote" placeholder="例: スーパー" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                </div>

                <div class="pt-2 flex space-x-2">
                    <button type="button" id="cancelTxBtn" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl">キャンセル</button>
                    <button type="submit" class="w-2/3 py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md shadow-brand-500/20">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Budget Settings -->
    <div id="budgetModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-sm font-bold text-slate-800">カテゴリ毎の月間予算</h3>
                <button id="closeBudgetModalBtn" class="text-slate-400 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="budgetInputsBox" class="overflow-y-auto space-y-3 flex-grow pr-1">
                <!-- Dynamically populated fields -->
            </div>

            <div class="pt-2 border-t border-slate-100 flex space-x-2">
                <button type="button" id="cancelBudgetBtn" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl">キャンセル</button>
                <button type="button" id="saveBudgetBtn" class="w-2/3 py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md">予算を更新</button>
            </div>
        </div>
    </div>

    <script>
        // Inline Service Worker Registration for PWA compliance
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        // Category Dictionary
        const CATEGORIES = {
            expense: [
                { id: 'food', name: '食費', icon: 'utensils', color: '#f59e0b' },
                { id: 'groceries', name: '日用品', icon: 'shopping-bag', color: '#10b981' },
                { id: 'housing', name: '住居費', icon: 'home', color: '#6366f1' },
                { id: 'utilities', name: '光熱費', icon: 'zap', color: '#3b82f6' },
                { id: 'transport', name: '交通費', icon: 'bus', color: '#8b5cf6' },
                { id: 'entertainment', name: '娯楽・趣味', icon: 'gamepad-2', color: '#ec4899' },
                { id: 'communication', name: '通信費', icon: 'smartphone', color: '#06b6d4' },
                { id: 'medical', name: '医療・健康', icon: 'heart-pulse', color: '#ef4444' },
                { id: 'other_expense', name: 'その他', icon: 'more-horizontal', color: '#64748b' }
            ],
            income: [
                { id: 'salary', name: '給与', icon: 'briefcase', color: '#10b981' },
                { id: 'bonus', name: '賞与', icon: 'award', color: '#059669' },
                { id: 'side_job', name: '副業・臨時', icon: 'sparkles', color: '#0284c7' },
                { id: 'other_income', name: 'その他収入', icon: 'plus-circle', color: '#64748b' }
            ]
        };

        // NO INITIAL DEMO DATA - COMPLETELY CLEAN STATE
        let transactions = [];
        let budgets = {};
        let currentMonth = new Date().toISOString().slice(0, 7);
        let activeTxType = 'expense';
        let homeChartInstance = null;

        // Load & Save to LocalStorage
        function loadStorageData() {
            const rawTx = localStorage.getItem('pwa_budget_tx_v1');
            const rawBudgets = localStorage.getItem('pwa_budget_goals_v1');
            transactions = rawTx ? JSON.parse(rawTx) : [];
            budgets = rawBudgets ? JSON.parse(rawBudgets) : {};
        }

        function saveStorageData() {
            localStorage.setItem('pwa_budget_tx_v1', JSON.stringify(transactions));
            localStorage.setItem('pwa_budget_goals_v1', JSON.stringify(budgets));
        }

        // Helpers
        function formatCurrency(num) {
            return '¥' + Number(num).toLocaleString('ja-JP');
        }

        function getCatInfo(catId, type = null) {
            const list = type ? CATEGORIES[type] : [...CATEGORIES.expense, ...CATEGORIES.income];
            return list.find(c => c.id === catId) || { name: 'その他', icon: 'tag', color: '#64748b' };
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-2xl shadow-lg text-xs font-bold text-white flex items-center justify-between transition-all duration-300 transform -translate-y-2 opacity-0 ${isError ? 'bg-rose-600' : 'bg-slate-900'}`;
            toast.innerHTML = `<span>${msg}</span><i data-lucide="${isError ? 'alert-circle' : 'check-circle'}" class="w-4 h-4 ml-2"></i>`;
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Navigation Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = 'nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600';
            });

            document.getElementById(`tab-${tabId}`)?.classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) {
                activeNav.className = 'nav-btn active flex flex-col items-center justify-center space-y-1 text-brand-600';
            }

            const titles = { home: 'ホーム', transactions: '取引明細', budgets: '月間予算', settings: '設定・データ' };
            document.getElementById('appHeaderSubtitle').textContent = titles[tabId] || '';

            renderCurrentTab();
        }

        function renderCurrentTab() {
            renderDashboardHome();
            renderTransactionsView();
            renderBudgetsView();
            lucide.createIcons();
        }

        // 1. Dashboard View
        function renderDashboardHome() {
            const mTx = transactions.filter(t => t.date.startsWith(currentMonth));
            const inc = mTx.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const exp = mTx.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

            document.getElementById('homeIncome').textContent = formatCurrency(inc);
            document.getElementById('homeExpense').textContent = formatCurrency(exp);
            document.getElementById('homeBalance').textContent = formatCurrency(inc - exp);

            // Empty State Control
            const emptyPrompt = document.getElementById('homeEmptyPrompt');
            if (transactions.length === 0) {
                emptyPrompt.classList.remove('hidden');
            } else {
                emptyPrompt.classList.add('hidden');
            }

            // Donut Chart
            const ctx = document.getElementById('homeCategoryChart').getContext('2d');
            const expCatSums = {};
            mTx.filter(t => t.type === 'expense').forEach(t => {
                expCatSums[t.category] = (expCatSums[t.category] || 0) + t.amount;
            });

            const labels = [];
            const data = [];
            const colors = [];

            Object.entries(expCatSums).forEach(([catId, amt]) => {
                const info = getCatInfo(catId, 'expense');
                labels.push(info.name);
                data.push(amt);
                colors.push(info.color);
            });

            document.getElementById('noChartText').style.display = data.length === 0 ? 'block' : 'none';

            if (homeChartInstance) homeChartInstance.destroy();

            homeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { font: { size: 10 }, boxWidth: 10 } }
                    },
                    cutout: '70%'
                }
            });

            // Recent Items List
            const recentContainer = document.getElementById('homeRecentList');
            recentContainer.innerHTML = '';
            const recentList = [...mTx].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 4);

            if (recentList.length === 0) {
                recentContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">今月の記録はありません</p>`;
            } else {
                recentList.forEach(t => {
                    const info = getCatInfo(t.category, t.type);
                    const isInc = t.type === 'income';
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 transition text-xs';
                    item.innerHTML = `
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white" style="background-color: ${info.color}">
                                <i data-lucide="${info.icon}" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">${info.name}</p>
                                <p class="text-[10px] text-slate-400">${t.date} ${t.note ? '・' + t.note : ''}</p>
                            </div>
                        </div>
                        <span class="font-bold ${isInc ? 'text-emerald-600' : 'text-slate-800'}">${isInc ? '+' : '-'}${formatCurrency(t.amount)}</span>
                    `;
                    recentContainer.appendChild(item);
                });
            }
        }

        // 2. Transactions View
        function renderTransactionsView() {
            const listContainer = document.getElementById('txFullList');
            const emptyState = document.getElementById('txEmptyState');
            listContainer.innerHTML = '';

            const searchKey = document.getElementById('txSearchInput').value.toLowerCase();
            const filterType = document.getElementById('txFilterType').value;
            const filterCat = document.getElementById('txFilterCategory').value;

            let filtered = transactions.filter(t => t.date.startsWith(currentMonth));

            if (filterType !== 'all') filtered = filtered.filter(t => t.type === filterType);
            if (filterCat !== 'all') filtered = filtered.filter(t => t.category === filterCat);
            if (searchKey) {
                filtered = filtered.filter(t => (t.note && t.note.toLowerCase().includes(searchKey)) || getCatInfo(t.category).name.includes(searchKey));
            }

            filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

            emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

            filtered.forEach(t => {
                const info = getCatInfo(t.category, t.type);
                const isInc = t.type === 'income';
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between text-xs';
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white shrink-0" style="background-color: ${info.color}">
                            <i data-lucide="${info.icon}" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <span class="font-bold text-slate-800">${info.name}</span>
                                <span class="text-[10px] text-slate-400">${t.date}</span>
                            </div>
                            <p class="text-[11px] text-slate-500 truncate max-w-[150px]">${t.note || 'メモなし'}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold ${isInc ? 'text-emerald-600' : 'text-slate-800'}">${isInc ? '+' : '-'}${formatCurrency(t.amount)}</span>
                        <button onclick="deleteTx('${t.id}')" class="p-1.5 text-slate-300 hover:text-rose-500 rounded-lg">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 3. Budget Progress View
        function renderBudgetsView() {
            const container = document.getElementById('budgetProgressList');
            container.innerHTML = '';

            const mExpenses = transactions.filter(t => t.date.startsWith(currentMonth) && t.type === 'expense');
            const spentMap = {};
            mExpenses.forEach(t => spentMap[t.category] = (spentMap[t.category] || 0) + t.amount);

            let count = 0;
            CATEGORIES.expense.forEach(cat => {
                const target = budgets[cat.id] || 0;
                if (target === 0) return;
                count++;

                const spent = spentMap[cat.id] || 0;
                const percent = Math.min(Math.round((spent / target) * 100), 100);
                const isOver = spent > target;

                const card = document.createElement('div');
                card.className = 'bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm space-y-2 text-xs';
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <div class="w-6 h-6 rounded-lg flex items-center justify-center text-white" style="background-color: ${cat.color}">
                                <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>
                            </div>
                            <span class="font-bold text-slate-800">${cat.name}</span>
                        </div>
                        <span class="font-semibold ${isOver ? 'text-rose-600' : 'text-slate-600'}">
                            ${formatCurrency(spent)} <span class="text-slate-400 font-normal">/ ${formatCurrency(target)}</span>
                        </span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                        <div class="${isOver ? 'bg-rose-500' : 'bg-brand-500'} h-2 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (count === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400 bg-white rounded-2xl border border-slate-100 p-6">
                        <i data-lucide="target" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
                        <p class="text-xs font-bold text-slate-600">予算が未設定です</p>
                        <p class="text-[10px] text-slate-400 mt-1">右上「設定」ボタンから月間予算を入力できます</p>
                    </div>
                `;
            }
        }

        // Form Category Populator
        function populateCategoryDropdown(type) {
            const select = document.getElementById('inputTxCategory');
            select.innerHTML = '';
            CATEGORIES[type].forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        function populateFilterCategories() {
            const select = document.getElementById('txFilterCategory');
            select.innerHTML = '<option value="all">全カテゴリ</option>';
            [...CATEGORIES.expense, ...CATEGORIES.income].forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        // Transaction Modal Controls
        const txModal = document.getElementById('txModal');
        
        function openTxModal() {
            document.getElementById('txForm').reset();
            document.getElementById('inputTxDate').value = new Date().toISOString().slice(0, 10);
            setModalTxType('expense');

            txModal.classList.remove('hidden');
            setTimeout(() => {
                txModal.classList.remove('opacity-0');
                txModal.querySelector('.id-modal-box')?.classList.remove('translate-y-full');
            }, 10);
        }

        function closeTxModal() {
            txModal.classList.add('opacity-0');
            txModal.querySelector('.id-modal-box')?.classList.add('translate-y-full');
            setTimeout(() => txModal.classList.add('hidden'), 200);
        }

        function setModalTxType(type) {
            activeTxType = type;
            const btnExp = document.getElementById('btnExpenseType');
            const btnInc = document.getElementById('btnIncomeType');

            if (type === 'expense') {
                btnExp.className = 'py-2 rounded-lg bg-white text-rose-600 shadow-sm transition';
                btnInc.className = 'py-2 rounded-lg text-slate-500 transition';
            } else {
                btnInc.className = 'py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition';
                btnExp.className = 'py-2 rounded-lg text-slate-500 transition';
            }
            populateCategoryDropdown(type);
        }

        document.getElementById('txForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('inputTxDate').value;
            const category = document.getElementById('inputTxCategory').value;
            const amount = parseInt(document.getElementById('inputTxAmount').value, 10);
            const note = document.getElementById('inputTxNote').value;

            transactions.push({
                id: 'tx-' + Date.now(),
                date,
                type: activeTxType,
                category,
                amount,
                note
            });

            saveStorageData();
            renderCurrentTab();
            closeTxModal();
            showToast('登録完了しました');
        });

        window.deleteTx = function(id) {
            if (confirm('この明細を削除しますか？')) {
                transactions = transactions.filter(t => t.id !== id);
                saveStorageData();
                renderCurrentTab();
                showToast('削除しました', true);
            }
        };

        // Budget Modal Controls
        const budgetModal = document.getElementById('budgetModal');

        function openBudgetModal() {
            const box = document.getElementById('budgetInputsBox');
            box.innerHTML = '';

            CATEGORIES.expense.forEach(c => {
                const val = budgets[c.id] || 0;
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between text-xs space-x-2';
                div.innerHTML = `
                    <span class="font-bold text-slate-700 min-w-[80px]">${c.name}</span>
                    <div class="relative flex-grow">
                        <span class="absolute left-2.5 top-2 text-slate-400 text-xs">¥</span>
                        <input type="number" data-b-cat="${c.id}" value="${val}" min="0" step="1000" class="w-full pl-6 pr-2 py-1.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800">
                    </div>
                `;
                box.appendChild(div);
            });

            budgetModal.classList.remove('hidden');
            setTimeout(() => budgetModal.classList.remove('opacity-0'), 10);
        }

        function closeBudgetModal() {
            budgetModal.classList.add('opacity-0');
            setTimeout(() => budgetModal.classList.add('hidden'), 200);
        }

        document.getElementById('saveBudgetBtn').addEventListener('click', () => {
            document.querySelectorAll('[data-b-cat]').forEach(inp => {
                const cat = inp.getAttribute('data-b-cat');
                budgets[cat] = parseInt(inp.value, 10) || 0;
            });
            saveStorageData();
            renderCurrentTab();
            closeBudgetModal();
            showToast('予算設定を保存しました');
        });

        // CSV Operations & Data Clear
        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            if (transactions.length === 0) return showToast('データが存在しません', true);

            let csv = 'ID,日付,種別,カテゴリ,金額,メモ\n';
            transactions.forEach(t => {
                const info = getCatInfo(t.category, t.type);
                csv += `${t.id},${t.date},${t.type},${info.name},${t.amount},"${(t.note || '').replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `budget_${currentMonth}.csv`;
            a.click();
            showToast('CSVを出力しました');
        });

        document.getElementById('clearAllDataBtn').addEventListener('click', () => {
            if (confirm('すべてのデータが完全に削除されます。よろしいですか？')) {
                transactions = [];
                budgets = {};
                saveStorageData();
                renderCurrentTab();
                showToast('全データを消去しました', true);
            }
        });

        // Event Attachments
        document.getElementById('globalMonthPicker').value = currentMonth;
        document.getElementById('globalMonthPicker').addEventListener('change', (e) => {
            currentMonth = e.target.value;
            renderCurrentTab();
        });

        document.getElementById('fabAddBtn').addEventListener('click', openTxModal);
        document.getElementById('closeTxModalBtn').addEventListener('click', closeTxModal);
        document.getElementById('cancelTxBtn').addEventListener('click', closeTxModal);

        document.getElementById('btnExpenseType').addEventListener('click', () => setModalTxType('expense'));
        document.getElementById('btnIncomeType').addEventListener('click', () => setModalTxType('income'));

        document.getElementById('openBudgetModalBtn').addEventListener('click', openBudgetModal);
        document.getElementById('closeBudgetModalBtn').addEventListener('click', closeBudgetModal);
        document.getElementById('cancelBudgetBtn').addEventListener('click', closeBudgetModal);

        document.getElementById('txSearchInput').addEventListener('input', renderTransactionsView);
        document.getElementById('txFilterType').addEventListener('change', renderTransactionsView);
        document.getElementById('txFilterCategory').addEventListener('change', renderTransactionsView);

        // App Launch Entry Point
        window.addEventListener('DOMContentLoaded', () => {
            loadStorageData();
            populateFilterCategories();
            switchTab('home');
        });
    </script>
</body>
</html>
